[project]
name = "director-cut-backend"
version = "0.1.0"
description = "Director's Cut – AI video production orchestration backend"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "aiosqlite>=0.20",
    "Pillow>=10.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
