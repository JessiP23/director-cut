[project]
name = "director-cut-backend"
version = "0.1.0"
description = "Director's Cut – AI video production orchestration backend"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "asyncpg>=0.29",
    "Pillow>=10.0",
    "structlog>=24.1",
    "mcp>=1.9",
    "fastmcp>=2.3",
    "python-jose[cryptography]>=3.3.0",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-httpx", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
