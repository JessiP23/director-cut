[project]
name = "director-cut-backend"
version = "0.1.0"
description = "Director's Cut – AI video production orchestration backend"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "aiosqlite>=0.20",
    "ffmpeg-python>=0.2",
    "python-dotenv>=1.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
