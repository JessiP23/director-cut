name: Build & Draft Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.4.35)"
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS Apple Silicon
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          # Ensure tag starts with v
          if [[ ! "$TAG" =~ ^v ]]; then
            echo "ERROR: Tag must start with 'v' (got: $TAG)"
            exit 1
          fi

          VERSION="${TAG#v}"

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved tag=$TAG version=$VERSION"

      - name: Patch tauri.conf.json version
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          # Update the version field in tauri.conf.json so the built binary
          # matches the tag — Tauri's updater compares these.
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json \
            > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
          echo "tauri.conf.json version set to $VERSION"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Validate signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          echo "Signing keys OK"

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DIRECTOR_EMBED_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          DIRECTOR_EMBED_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          DIRECTOR_EMBED_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "Checking Supabase URL is set: ${DIRECTOR_EMBED_SUPABASE_URL:0:30}..."
          if [[ -z "$DIRECTOR_EMBED_SUPABASE_URL" || -z "$DIRECTOR_EMBED_SUPABASE_ANON_KEY" ]]; then
            echo "ERROR: Supabase secrets missing in GitHub Actions"
            exit 1
          fi
          cargo tauri build --target aarch64-apple-darwin

      - name: Verify build artifacts exist
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"

          DMG="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/director-cut_${VERSION}_aarch64.dmg"
          TAR="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/director-cut.app.tar.gz"
          SIG="${TAR}.sig"

          for f in "$DMG" "$TAR" "$SIG"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing artifact: $f"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Create git tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Create the tag pointing at the current commit if it doesn't exist
          git tag "$TAG" || echo "Tag $TAG already exists, skipping"
          git push origin "$TAG" || echo "Tag already pushed"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          DMG="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/director-cut_${VERSION}_aarch64.dmg"
          TAR="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/director-cut.app.tar.gz"
          SIG="${TAR}.sig"

          gh release create "$TAG" \
            --title "Director's Cut $TAG" \
            --notes "Release $TAG" \
            --target "${{ github.sha }}" \
            "$DMG" \
            "$TAR" \
            "$SIG"

          echo "Release created: https://github.com/JessiP23/director-cut/releases/tag/$TAG"

      - name: Generate updater JSON and update gist
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          SIGNATURE=$(cat src-tauri/target/aarch64-apple-darwin/release/bundle/macos/director-cut.app.tar.gz.sig)
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag }}"
          REPO="JessiP23/director-cut"

          ASSET_URL="https://github.com/${REPO}/releases/download/${TAG}/director-cut.app.tar.gz"

          RELEASES_JSON=$(jq -n \
            --arg version "$VERSION" \
            --arg notes "New features and bug fixes for v$VERSION" \
            --arg pub_date "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg signature "$SIGNATURE" \
            --arg url "$ASSET_URL" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": {
                  signature: $signature,
                  url: $url
                }
              }
            }')

          JSON_PAYLOAD=$(jq -n --arg content "$RELEASES_JSON" \
            '{files: {"releases.json": {content: $content}}}')

          echo "Updating gist:"
          echo "$RELEASES_JSON" | jq .

          RESPONSE=$(curl -sS -w "\n%{http_code}" \
            -X PATCH \
            -H "Authorization: token $RELEASE_PAT" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" \
            "https://api.github.com/gists/f9c9818cbb6d8a28798e619fface794c")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "ERROR: Gist update failed ($HTTP_CODE)"
            echo "$BODY"
            exit 1
          fi
          echo "✅ Gist updated successfully"