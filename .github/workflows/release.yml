name: Build & Draft Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS Apple Silicon
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Tauri CLI via Cargo
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Debug - Verify signing secrets exist
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "=== SIGNING DEBUG INFO ==="
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "❌ TAURI_SIGNING_PRIVATE_KEY is EMPTY"
            exit 1
          else
            echo "✅ TAURI_SIGNING_PRIVATE_KEY is set"
            echo "First line: $(echo "$TAURI_SIGNING_PRIVATE_KEY" | head -n1)"
            echo "Total lines: $(echo "$TAURI_SIGNING_PRIVATE_KEY" | wc -l)"
            FIRST_LINE=$(echo "$TAURI_SIGNING_PRIVATE_KEY" | head -n1)
            if [[ "$FIRST_LINE" == dW50cnVzdGVk* ]]; then
              echo "⚠️  WARNING: Key is BASE64. Decode it first."
              exit 1
            elif [[ "$FIRST_LINE" == "untrusted comment:"* ]]; then
              echo "✅ Key format looks correct"
            fi
          fi
          echo "=== END DEBUG INFO ==="

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "Starting build..."
          cargo tauri build --target aarch64-apple-darwin
          echo "Build finished. Checking for signature..."
          ls -la src-tauri/target/aarch64-apple-darwin/release/bundle/macos/

      - name: Verify signature was created
        run: |
          SIG_FILE=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.sig 2>/dev/null || true)
          if [ -z "$SIG_FILE" ]; then
            echo "❌ ERROR: No .sig file found! Signing failed."
            exit 1
          else
            echo "✅ SUCCESS: Signature file created: $SIG_FILE"
            cat "$SIG_FILE"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Director's Cut v${{ steps.version.outputs.version }}"
          draft: true
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.tar.gz.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}