name: Build & Draft Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS Apple Silicon
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      # -----------------------------
      # Version (no Python dependency)
      # -----------------------------
      - name: Read version
        id: version
        run: |
          VERSION=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # -----------------------------
      # Signing env sanity check
      # -----------------------------
      - name: Validate signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Missing TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi

            if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
              echo "Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
              exit 1
          fi

    echo "✅ Signing secrets are present (masked in logs by GitHub)"

      # -----------------------------
      # Build
      # -----------------------------
      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cargo tauri build --target aarch64-apple-darwin

      # -----------------------------
      # Verify outputs
      # -----------------------------
      - name: List artifacts
        run: |
          ls -R src-tauri/target/aarch64-apple-darwin/release/bundle/

      - name: Verify build outputs exist
        run: |
          test -d src-tauri/target/aarch64-apple-darwin/release/bundle/macos || exit 1
          test -d src-tauri/target/aarch64-apple-darwin/release/bundle/dmg || exit 1

      # -----------------------------
      # Release
      # -----------------------------
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Director's Cut v${{ steps.version.outputs.version }}"
          draft: true
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}