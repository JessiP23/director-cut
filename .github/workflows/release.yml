name: Build & Draft Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS Apple Silicon
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable, aarch64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # Cache ~/.cargo/registry + src-tauri/target — biggest time saver
      - name: Rust + Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true
          key: aarch64-apple-darwin

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # tauri-action has cargo-tauri pre-installed — no separate install step
      - name: Build & create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: "Director's Cut v${{ steps.version.outputs.version }} — AI Video Production Studio"
          releaseBody: |
            ## Download & Install (macOS Apple Silicon)

            1. Download `director-cut_${{ steps.version.outputs.version }}_aarch64.dmg` below
            2. Open the `.dmg` → drag **Director's Cut** into Applications
            3. Right-click → Open on first launch (bypasses Gatekeeper)

            ---

            ### Requirements
            - macOS 12+ (Apple Silicon / M1+)
            - Python 3.9+ (`xcode-select --install`)
            - API Keys — prompted on first launch:
              - [Groq API Key](https://console.groq.com) (free)
              - [fal.ai API Key](https://fal.ai/dashboard) (~$0.04/clip)

            ### First Launch
            App auto-creates a Python environment on first run (~15 sec). After that, instant.
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin
