name: Build & Draft Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS Apple Silicon
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Read tag and version
        id: meta
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Validate signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          echo "Signing keys OK"

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cargo tauri build --target aarch64-apple-darwin

      - name: Create release with GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This will fail if the tag doesn't exist, which is what we want
          # No more untagged bullshit
          gh release create "${{ steps.meta.outputs.tag }}" \
            --draft \
            --title "Director's Cut ${{ steps.meta.outputs.tag }}" \
            --notes "Release ${{ steps.meta.outputs.tag }}" \
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg \
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/director-cut.app.tar.gz \
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/director-cut.app.tar.gz.sig

      - name: Generate updater JSON and update gist
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          SIGNATURE=$(cat src-tauri/target/aarch64-apple-darwin/release/bundle/macos/director-cut.app.tar.gz.sig)
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag }}"
          REPO="JessiP23/director-cut"
          
          # This URL format is guaranteed by GitHub. No API calls needed.
          ASSET_URL="https://github.com/${REPO}/releases/download/${TAG}/director-cut.app.tar.gz"

          RELEASES_JSON=$(jq -n \
            --arg version "$VERSION" \
            --arg notes "New features and bug fixes for v$VERSION" \
            --arg pub_date "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg signature "$SIGNATURE" \
            --arg url "$ASSET_URL" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": {
                  signature: $signature,
                  url: $url
                }
              }
            }')

          JSON_PAYLOAD=$(jq -n --arg content "$RELEASES_JSON" '{files: {"releases.json": {content: $content}}}')

          curl -sS \
            -X PATCH \
            -H "Authorization: token $RELEASE_PAT" \
            -d "$JSON_PAYLOAD" \
            "https://api.github.com/gists/f9c9818cbb6d8a28798e619fface794c"