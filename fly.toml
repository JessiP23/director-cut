# fly.toml app configuration file generated for director-cut on 2026-05-08T13:52:51-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# DATABASE_URL must be set as a Fly secret (NOT hardcoded here):
#   fly secrets set DATABASE_URL="postgresql://postgres:<password>@db.<project>.supabase.co:5432/postgres"
#
# Runs are persisted in Supabase Postgres — no local SQLite file, no ephemeral state.

app = 'director-cut'
primary_region = 'ord'

[build]
  dockerfile = 'backend/Dockerfile'

# Fly proxies to internal_port; the Docker image uses ${PORT:-9420}.
# Without PORT, uvicorn binds 9420 while the proxy expects 8080 → connection refused.
[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

# Persistent volume so generated video/image exports survive machine restarts.
# The render agent writes to /app/data/exports/ and the backend serves
# those files at /media/exports/... via FastAPI StaticFiles.
[[mounts]]
  source      = "director_cut_data"
  destination = "/app/data"
